<section>
    <h2>Cadastro de Voluntários e Doadores</h2>

    <span class="badge badge-sucesso">Voluntário Ativo</span>
    <span class="badge badge-alerta">Vaga Limitada</span>

    <div class="alerta alerta-sucesso" id="alertaSucesso" style="display: none;">
        Cadastro realizado com sucesso! Em breve entraremos em contato.
    </div>

    <form id="formCadastro">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf"
                   pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                   placeholder="000.000.000-00"
                   title="Formato esperado: 000.000.000-00"
                   required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone"
                   pattern="\(\d{2}\)\s\d{5}-\d{4}"
                   placeholder="(00) 00000-0000"
                   title="Formato esperado: (00) 00000-0000"
                   required>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep"
                   pattern="\d{5}-\d{3}"
                   placeholder="00000-000"
                   title="Formato esperado: 00000-000"
                   required>
        </fieldset>

        <button type="submit">Enviar cadastro</button>
    </form>
</section>
